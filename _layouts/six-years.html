<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    {% seo %}
    <link rel="shortcut icon" type="image/png" href="{{ site.baseurl }}/assets/images/trace.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/six-years.css">
</head>
<body class="layout-six-years">
    {% include site-header.html %}
    {% include six-years-body.html %}
    <script>
    (function () {
      var banner = document.querySelector('.layout-six-years > header[role="banner"]');
      if (!banner) return;
      function sync() {
        var h = banner.offsetHeight + 'px';
        document.documentElement.style.setProperty('--cam-banner-h', h);
        document.body.style.setProperty('--cam-banner-h', h);
      }
      sync();
      window.addEventListener('resize', sync);
      var logo = banner.querySelector('img');
      if (logo) logo.addEventListener('load', sync);
    })();
    </script>
    <script src="{{ site.baseurl }}/assets/js/six-years.js"></script>
</body>
</html>
